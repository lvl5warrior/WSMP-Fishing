      LEATHER_BOOTS: {type: FISHING, level: 72, min-amount: 2, max-amount: 5}
  7:
    name: "Tier 7"
    display: "&6&lTier 7"
    difficulty: "Legendary"
    min-level: 85
    base-coins: 600
    premium: true
    resources: {}
    # Tier 7 doesn't use a normal task pool — see legendary-requests below.

