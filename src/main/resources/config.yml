# Only one Legendary Request in this split — the Triad Trial (which spanned
# mining/woodcutting/farming) never applied to Fishing in the first place.
# The Big Catch reuses Nautilus Shell from the Tier 5 pool.
legendary-requests:
  the_big_catch:
    display: "&b🐉 The Big Catch"
    material: NAUTILUS_SHELL
    min-amount: 8
    max-amount: 16
    yield: 600
    cooldown-hours: 12

streak-bonus:
  5: 0.15
  10: 0.25
  25: 0.40
  50: 0.65
  100: 0.90

