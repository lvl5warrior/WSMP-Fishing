# WSMP-Fishing configuration
# Points are an in-plugin currency earned from tasks and The Big Catch
# Legendary Request — NOT real money, NOT shared with any other plugin.
# Every number in this file is a placeholder ratio; rebalance to taste.
#
# Fishing has no natural "tier" gating in vanilla Minecraft (loot is random
# regardless of player level) — tiers here gate which TASK you're offered,
# the same way mining/woodcutting/farming tiers gate task assignment rather
# than what you're physically capable of doing. What you can actually catch
# in the world is unaffected by your Angler level.

settings:
  skip-cost: 150.0
  task-block-cost: 200.0
  master-teleport-cost: 6600.0
  master-teleport-cooldown-minutes: 30
  guide-book-cooldown-hours: 24
  npc-shop-radius: 5.0

